databaseChangeLog:
  - changeSet:
      id: '00000000000000'
      author: jhipster
      changes:
        - createSequence:
            sequenceName: sequence_generator
            startValue: 1050
            incrementBy: 50

  - changeSet:
      id: '00000000000001'
      author: jhipster
      # JHipster core tables placeholder (empty in original)
      # The real content is usually generated/overwritten by JHipster
      changes: []

  - changeSet:
      id: '00000000000002'
      author: jhipster
      context: test
      changes:
        - createTable:
            tableName: jhi_date_time_wrapper
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: jhi_date_time_wrapperPK

              - column:
                  name: instant
                  type: timestamp

              - column:
                  name: local_date_time
                  type: timestamp

              - column:
                  name: offset_date_time
                  type: timestamp

              - column:
                  name: zoned_date_time
                  type: timestamp

              - column:
                  name: local_time
                  type: time

              - column:
                  name: offset_time
                  type: time

              - column:
                  name: local_date
                  type: date
