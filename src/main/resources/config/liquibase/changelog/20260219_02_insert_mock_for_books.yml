databaseChangeLog:
  - changeSet:
      id: 2026-02-20-0001-seed-data-with-auditing-fixed-dates
      author: michael.gawritschkow
      comment: Seed initial fake data – auditing columns + fixed absolute dates (no INTERVAL)
