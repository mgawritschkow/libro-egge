        # ── Mock reviews ──────────────────────────────────────────────────────
        - sql:
            sql: |
              INSERT INTO reviews (
                book_id, user_id, rating, title, comment, is_helpful_count,
                created_by, created_date, last_modified_by, last_modified_date
              ) VALUES
                (1, 1, 5, 'A timeless favorite', 'Jane Austen’s wit is unmatched. Elizabeth Bennet is such an icon.', 14,
                 'system-seed', '2026-02-02 10:00:00+00', 'system-seed', '2026-02-02 10:00:00+00'),
                (1, 3, 4, 'Charming but dated', 'Loved the romance, but some social commentary feels old-fashioned now.', 5,
                 'system-seed', '2026-02-08 10:00:00+00', 'system-seed', '2026-02-08 10:00:00+00'),
                (2, 2, 5, 'Perfect adventure', 'Bilbo’s journey is pure magic. Read it as a child and still love it.', 11,
                 'system-seed', '2026-01-26 10:00:00+00', 'system-seed', '2026-01-26 10:00:00+00'),
                (2, 4, 5, 'Epic fantasy start', 'Tolkien at his most accessible. Great introduction to Middle-earth.', 8,
                 'system-seed', '2026-02-11 10:00:00+00', 'system-seed', '2026-02-11 10:00:00+00'),
                (3, 1, 5, 'Profound and necessary', 'Harper Lee captures empathy and injustice so powerfully.', 19,
                 'system-seed', '2026-02-13 10:00:00+00', 'system-seed', '2026-02-13 10:00:00+00'),
                (3, 5, 5, 'Still relevant today', 'Atticus Finch is a role model. Everyone should read this.', 13,
                 'system-seed', '2026-02-16 10:00:00+00', 'system-seed', '2026-02-16 10:00:00+00'),
                (4, 3, 4, 'Unsettling masterpiece', 'Big Brother is watching – and it feels more real every year.', 10,
                 'system-seed', '2026-02-05 10:00:00+00', 'system-seed', '2026-02-05 10:00:00+00'),
                (4, 2, 5, 'Chilling warning', 'Orwell predicted so much. A must-read for understanding power.', 7,
                 'system-seed', '2026-02-14 10:00:00+00', 'system-seed', '2026-02-14 10:00:00+00'),
                (5, 4, 3, 'Beautiful writing, empty story', 'Gorgeous prose, but the characters left me cold.', 4,
                 'system-seed', '2026-02-10 10:00:00+00', 'system-seed', '2026-02-10 10:00:00+00'),
                (5, 1, 4, 'The American Dream dissected', 'Fitzgerald nails the illusion of wealth and happiness.', 6,
                 'system-seed', '2026-02-18 10:00:00+00', 'system-seed', '2026-02-18 10:00:00+00');

